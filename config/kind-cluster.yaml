# Kind 集群配置
# - 单控制平面 + 单 Worker 节点
# - 配置 containerd 注册表镜像，绕过 Docker Hub 封锁
# - 开启必要的内核特性供调试（ptrace, SYS_ADMIN 等）
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4

name: k8s-debug

nodes:
  - role: control-plane
    # 使用本地从源码构建的节点镜像
    # 若未构建，可改为: registry.k8s.io/kindest/node:v1.32.0
    image: kindest/node:local-debug

    # 挂载宿主机目录到节点（用于注入调试二进制和源码）
    extraMounts:
      - hostPath: /tmp/k8s-debug-bins
        containerPath: /debug-bins
        readOnly: false
      - hostPath: /tmp/k8s-debug-src
        containerPath: /debug-src
        readOnly: true

    # 开放调试端口（dlv headless 监听）
    extraPortMappings:
      - containerPort: 2345   # kube-apiserver dlv
        hostPort: 2345
        protocol: TCP
      - containerPort: 2346   # kube-controller-manager dlv
        hostPort: 2346
        protocol: TCP
      - containerPort: 2347   # kube-scheduler dlv
        hostPort: 2347
        protocol: TCP
      - containerPort: 2348   # kubelet dlv
        hostPort: 2348
        protocol: TCP
      - containerPort: 2349   # kube-proxy dlv
        hostPort: 2349
        protocol: TCP
      - containerPort: 2350   # containerd dlv
        hostPort: 2350
        protocol: TCP

    # kubeadm 配置补丁：关闭 kube-scheduler 和 kube-controller-manager 静态 Pod
    # （改为在节点上手动运行 dlv exec 版本）
    kubeadmConfigPatches:
      - |
        kind: ClusterConfiguration
        apiServer:
          extraArgs:
            # 允许 privileged 容器（供 runc 调试）
            allow-privileged: "true"
        scheduler:
          extraArgs: {}
        controllerManager:
          extraArgs: {}
      - |
        kind: KubeletConfiguration
        # 允许 dlv attach 所需的 ptrace 权限
        featureGates:
          KubeletInUserNamespace: false

  - role: worker
    image: kindest/node:local-debug
    extraMounts:
      - hostPath: /tmp/k8s-debug-bins
        containerPath: /debug-bins
        readOnly: false

# containerd 注册表镜像配置（在 Kind 节点的 containerd 内生效）
# 解决 Docker Hub 被封锁的问题
containerdConfigPatches:
  - |-
    [plugins."io.containerd.grpc.v1.cri".registry]
      config_path = "/etc/containerd/certs.d"

  - |-
    # Docker Hub 镜像（docker.io）
    # 文件将写入 /etc/containerd/certs.d/docker.io/hosts.toml
    # 见 scripts/05-inject-binaries.sh 中的实际写入逻辑

featureGates:
  # 保持与上游 k8s 一致的 feature gates
  {}
