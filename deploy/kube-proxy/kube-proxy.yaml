# kube-proxy 部署（使用宿主机调试二进制）
#
# 说明：
#   此 YAML 用于将 kube-proxy 作为 DaemonSet 部署到集群
#   调试时推荐使用 debug/kube-proxy.sh（host 进程 dlv exec 模式）
#
# 前置：
#   /usr/local/bin/kube-proxy 已含 DWARF 调试符号（scripts/05-inject-binaries.sh 注入）
#
# 使用方式：
#   kubectl apply -f deploy/kube-proxy/kube-proxy.yaml
#   bash debug/kube-proxy.sh   # 然后用 dlv exec 模式调试（推荐）

# ── RBAC ──────────────────────────────────────────────────────────────────────
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kube-proxy
  namespace: kube-system
---
kind: ClusterRoleBinding
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: system:kube-proxy
subjects:
  - kind: ServiceAccount
    name: kube-proxy
    namespace: kube-system
roleRef:
  kind: ClusterRole
  name: system:node-proxier
  apiGroup: rbac.authorization.k8s.io

# ── ConfigMap：KubeProxyConfiguration + kubeconfig ────────────────────────────
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: kube-proxy
  namespace: kube-system
data:
  config.conf: |
    apiVersion: kubeproxy.config.k8s.io/v1alpha1
    kind: KubeProxyConfiguration
    clusterCIDR: "10.244.0.0/16"
    mode: "iptables"
    healthzBindAddress: "0.0.0.0:10256"
    metricsBindAddress: "127.0.0.1:10249"
    clientConnection:
      kubeconfig: /var/lib/kube-proxy/kubeconfig.conf
  kubeconfig.conf: |
    apiVersion: v1
    kind: Config
    clusters:
    - cluster:
        certificate-authority: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        server: https://kubernetes.default.svc.cluster.local
      name: default
    contexts:
    - context:
        cluster: default
        namespace: default
        user: default
      name: default
    current-context: default
    users:
    - name: default
      user:
        tokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token

# ── DaemonSet（使用宿主机 kube-proxy 二进制）──────────────────────────────────
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: kube-proxy
  namespace: kube-system
  labels:
    k8s-app: kube-proxy
spec:
  selector:
    matchLabels:
      k8s-app: kube-proxy
  updateStrategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        k8s-app: kube-proxy
    spec:
      serviceAccountName: kube-proxy
      hostNetwork: true
      hostPID: true
      priorityClassName: system-node-critical
      tolerations:
        - operator: Exists
          effect: NoSchedule
      initContainers:
        # 将宿主机 kube-proxy 二进制复制到 emptyDir，供主容器使用
        - name: copy-binary
          image: busybox:1.36
          command: ["cp", "/host/kube-proxy", "/kube-proxy/kube-proxy"]
          volumeMounts:
            - name: host-bin
              mountPath: /host
            - name: kube-proxy-bin
              mountPath: /kube-proxy
      containers:
        - name: kube-proxy
          image: busybox:1.36
          command: ["/kube-proxy/kube-proxy"]
          args:
            - --config=/var/lib/kube-proxy/config.conf
            - --hostname-override=$(NODE_NAME)
            - --v=5
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          securityContext:
            privileged: true
          volumeMounts:
            - name: kube-proxy-bin
              mountPath: /kube-proxy
            - name: kube-proxy-config
              mountPath: /var/lib/kube-proxy
            - name: xtables-lock
              mountPath: /run/xtables.lock
              readOnly: false
            - name: lib-modules
              mountPath: /lib/modules
              readOnly: true
      volumes:
        - name: host-bin
          hostPath:
            path: /usr/local/bin
            type: Directory
        - name: kube-proxy-bin
          emptyDir: {}
        - name: kube-proxy-config
          configMap:
            name: kube-proxy
        - name: xtables-lock
          hostPath:
            path: /run/xtables.lock
            type: FileOrCreate
        - name: lib-modules
          hostPath:
            path: /lib/modules
